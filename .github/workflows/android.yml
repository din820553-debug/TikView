name: Build Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check navigation and proxy validation
        run: |
          mkdir -p /tmp/tikview-checks
          javac -d /tmp/tikview-checks app/src/main/java/dev/tikview/UrlPolicy.java checks/UrlPolicyCheck.java
          java -cp /tmp/tikview-checks dev.tikview.UrlPolicyCheck
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Lint and build installable debug APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TikView-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
